name: homevault

services:
  postgres:
    image: postgres:16-alpine
    container_name: homevault-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homevault}
      POSTGRES_USER: ${POSTGRES_USER:-homevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homevault}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: homevault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-homevault}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-homevault-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-create-bucket:
    image: minio/mc:latest
    container_name: homevault-minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-homevault}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-homevault-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-homevault-files}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb -p local/$$MINIO_BUCKET || true;
      /usr/bin/mc anonymous set none local/$$MINIO_BUCKET;
      "

  redis:
    image: redis:7-alpine
    container_name: homevault-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-homevault-redis}"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-homevault-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homevault-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-homevault}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-homevault}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-homevault}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-homevault-redis}
      HOMEVAULT_STORAGE_PROVIDER: minio
      HOMEVAULT_MINIO_ENDPOINT: http://minio:9000
      HOMEVAULT_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-homevault}
      HOMEVAULT_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-homevault-secret}
      HOMEVAULT_MINIO_BUCKET: ${MINIO_BUCKET:-homevault-files}
      HOMEVAULT_JWT_SECRET: ${JWT_SECRET:-change-this-secret-to-a-long-random-value-at-least-64-bytes}
      HOMEVAULT_JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      HOMEVAULT_JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      HOMEVAULT_ADMIN_EMAIL: ${HOMEVAULT_ADMIN_EMAIL:-admin@homevault.local}
      HOMEVAULT_ADMIN_PASSWORD: ${HOMEVAULT_ADMIN_PASSWORD:-Admin12345}
      HOMEVAULT_ADMIN_DISPLAY_NAME: ${HOMEVAULT_ADMIN_DISPLAY_NAME:-HomeVault Admin}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: homevault-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
  minio-data:
  redis-data:
