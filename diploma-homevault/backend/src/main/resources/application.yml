spring:
  application:
    name: homevault-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/homevault}
    username: ${SPRING_DATASOURCE_USERNAME:homevault}
    password: ${SPRING_DATASOURCE_PASSWORD:homevault}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${HOMEVAULT_MAX_FILE_SIZE:100MB}
      max-request-size: ${HOMEVAULT_MAX_REQUEST_SIZE:100MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: HomeVault Backend
    description: Self-hosted file and notes storage API
    version: 0.1.0
    java-version: "21"
    architecture: modular monolith
    storage-provider: ${HOMEVAULT_STORAGE_PROVIDER:minio}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

homevault:
  admin:
    seed:
      email: ${HOMEVAULT_ADMIN_EMAIL:}
      password: ${HOMEVAULT_ADMIN_PASSWORD:}
      display-name: ${HOMEVAULT_ADMIN_DISPLAY_NAME:HomeVault Admin}
  cors:
    allowed-origins: ${HOMEVAULT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${HOMEVAULT_JWT_SECRET:}
    access-ttl-minutes: ${HOMEVAULT_JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${HOMEVAULT_JWT_REFRESH_TTL_DAYS:14}
  storage:
    provider: ${HOMEVAULT_STORAGE_PROVIDER:minio}
  minio:
    endpoint: ${HOMEVAULT_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${HOMEVAULT_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${HOMEVAULT_MINIO_SECRET_KEY:minioadmin}
    bucket: ${HOMEVAULT_MINIO_BUCKET:homevault-files}

logging:
  level:
    ru.otus.homevault: INFO
