spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/homevault}
    username: ${SPRING_DATASOURCE_USERNAME:homevault}
    password: ${SPRING_DATASOURCE_PASSWORD:homevault}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

homevault:
  cors:
    allowed-origins: ${HOMEVAULT_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  minio:
    endpoint: ${HOMEVAULT_MINIO_ENDPOINT:http://minio:9000}
    access-key: ${HOMEVAULT_MINIO_ACCESS_KEY:}
    secret-key: ${HOMEVAULT_MINIO_SECRET_KEY:}
    bucket: ${HOMEVAULT_MINIO_BUCKET:homevault-files}

