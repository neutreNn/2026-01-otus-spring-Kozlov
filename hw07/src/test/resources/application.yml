spring:
  datasource:
    url: jdbc:h2:mem:testdb
  jpa:
    hibernate:
      ddl-auto: none
  shell:
    history:
      enabled: false
    interactive:
      enabled: false
    noninteractive:
      enabled: false
    script:
      enabled: false
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql
