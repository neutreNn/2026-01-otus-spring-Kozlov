<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${bookForm.id == null ? 'Новая книга' : 'Редактирование книги'}">Форма книги</title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: navigation}"></header>

<main class="page page--narrow">
    <section class="page-header page-header--stacked">
        <div>
            <p class="eyebrow" th:text="${bookForm.id == null ? 'Создание' : 'Редактирование'}">Создание</p>
            <h1 th:text="${bookForm.id == null ? 'Новая книга' : 'Книга #' + bookForm.id}">Новая книга</h1>
        </div>
    </section>

    <form class="form" th:action="@{${formAction}}" th:object="${bookForm}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-field">
            <label for="title">Название</label>
            <input id="title" type="text" th:field="*{title}" required maxlength="255">
            <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Ошибка</p>
        </div>

        <div class="form-field">
            <label for="authorId">Автор</label>
            <select id="authorId" th:field="*{authorId}" required>
                <option value="0">Выберите автора</option>
                <option th:each="author : ${authors}"
                        th:value="${author.id}"
                        th:text="${author.fullName}">Author_1</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('authorId')}" th:errors="*{authorId}">Ошибка</p>
        </div>

        <div class="form-field">
            <label for="genreId">Жанр</label>
            <select id="genreId" th:field="*{genreId}" required>
                <option value="0">Выберите жанр</option>
                <option th:each="genre : ${genres}"
                        th:value="${genre.id}"
                        th:text="${genre.name}">Genre_1</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('genreId')}" th:errors="*{genreId}">Ошибка</p>
        </div>

        <div class="actions">
            <button class="button button--primary" type="submit">Сохранить</button>
            <a class="button button--ghost" th:href="@{/books}">Отмена</a>
        </div>
    </form>
</main>
</body>
</html>
