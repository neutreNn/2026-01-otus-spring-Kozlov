<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Книги</title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>
<header th:replace="~{fragments/navigation :: navigation}"></header>

<main class="page">
    <section class="page-header">
        <div>
            <p class="eyebrow">Каталог</p>
            <h1>Книги</h1>
        </div>
        <a class="button button--primary" th:href="@{/books/new}">Добавить книгу</a>
    </section>

    <section class="table-section" th:if="${!books.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Название</th>
                <th scope="col">Автор</th>
                <th scope="col">Жанр</th>
                <th scope="col">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td>
                    <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">BookTitle_1</a>
                </td>
                <td th:text="${book.authorFullName}">Author_1</td>
                <td th:text="${book.genreName}">Genre_1</td>
                <td>
                    <div class="actions">
                        <a class="button button--ghost" th:href="@{/books/{id}(id=${book.id})}">Открыть</a>
                        <a class="button button--ghost" th:href="@{/books/{id}/edit(id=${book.id})}">Редактировать</a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post">
                            <button class="button button--danger" type="submit">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="empty-state" th:if="${books.isEmpty()}">
        <h2>Книг пока нет</h2>
        <a class="button button--primary" th:href="@{/books/new}">Добавить первую книгу</a>
    </section>
</main>
</body>
</html>
