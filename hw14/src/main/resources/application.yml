spring:
  application:
    name: spring-batch-library-migration
  main:
    web-application-type: none
  datasource:
    url: jdbc:h2:mem:library-migration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  data:
    mongodb:
      database: library
